apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-backend
  namespace: default  # sesuaikan dengan namespace cluster
  labels:
    app: rag-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-backend
  template:
    metadata:
      labels:
        app: rag-backend
    spec:
      containers:
        - name: rag-backend
          image: your-registry/rag-backend:latest  # ganti dengan image aktual
          ports:
            - containerPort: 3000
          # Env vars dari ConfigMap (non-secret) + Secret (credentials)
          envFrom:
            - configMapRef:
                name: rag-backend-config
            - secretRef:
                name: rag-backend-secret
          # Cache model embedding (hindari download ulang tiap restart)
          volumeMounts:
            - name: model-cache
              mountPath: /app/.cache
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3

        # arq worker — sidecar untuk drain Redis job queue
        - name: arq-worker
          image: your-registry/rag-backend:latest  # image sama dengan backend
          command: ["arq", "app.background.arq_worker.WorkerSettings"]
          envFrom:
            - configMapRef:
                name: rag-backend-config
            - secretRef:
                name: rag-backend-secret
          volumeMounts:
            - name: model-cache
              mountPath: /app/.cache
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

      volumes:
        - name: model-cache
          emptyDir: {}  # ganti PersistentVolumeClaim jika ingin persistent cache

---
apiVersion: v1
kind: Service
metadata:
  name: rag-backend
  namespace: default
spec:
  selector:
    app: rag-backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
