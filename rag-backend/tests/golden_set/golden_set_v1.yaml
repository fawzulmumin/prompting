      module: geo
      entities:
        landmark: "monas"
        kabupaten: "jakarta"
    must_not:
      module: out_of_context
    tags: [geo, landmark, jakarta]
    notes: "Geo query dengan landmark terkenal."

  - id: geo_002
    query: "SMP negeri dekat stasiun depok baru"
    expected:
      module: geo
      entities:
        jenjang: [SMP]
        status: NEGERI
        landmark: "stasiun depok baru"
    must_not:
      module: out_of_context
    tags: [geo, landmark, filter_jenjang]
    notes: "Geo + filter jenjang + status."

  - id: geo_003
    query: "ada sekolah apa di sekitar bundaran HI"
    expected:
      module: geo
      entities:
        landmark: "bundaran HI"
    must_not:
      module: out_of_context
    tags: [geo, landmark, informal]
    notes: "Frasa informal 'di sekitar'."

  - id: geo_004
    query: "SMA terdekat dari koordinat -6.2088,106.8456"
    expected:
      module: geo
      entities:
        jenjang: [SMA]
        koordinat: [-6.2088, 106.8456]
    must_not:
      module: out_of_context
    tags: [geo, koordinat]
    notes: "Geo query dengan koordinat langsung."

  # ---------------------------------------------------------------------------
  # MULTI-INTENT — Query Kompleks (5 cases)
  # ---------------------------------------------------------------------------

  - id: multi_001
    query: "bandingkan SMK di Bandung dan Bekasi, tampilkan juga daftarnya"
    expected:
      module: multi_intent
      sub_intents: [comparison, list]
      entities:
        jenjang: [SMK]
        wilayah: ["bandung", "bekasi"]
    must_not:
      module: out_of_context
    tags: [multi_intent, comparison_plus_list]
    notes: "Dua intent eksplisit dalam satu query."

  - id: multi_002
    query: "berapa total SD di Jawa Barat dan mana yang terbanyak per kabupaten"
    expected:
      module: multi_intent
      sub_intents: [aggregation, ranking]
      entities:
        jenjang: [SD]
        provinsi: "jawa barat"
    must_not:
      module: out_of_context
    tags: [multi_intent, aggregation_plus_ranking]
    notes: "Aggregation + ranking dalam satu query."

  - id: multi_003
    query: "profil SMAN 3 Bandung dan berapa total SMA di kota Bandung"
    expected:
      module: multi_intent
      sub_intents: [profile, aggregation]
      entities:
        nama_sekolah: "SMAN 3 Bandung"
        kabupaten: "bandung"
        jenjang: [SMA]
    must_not:
      module: out_of_context
    tags: [multi_intent, profile_plus_aggregation]
    notes: "Profile sekolah spesifik + aggregation area."

  - id: multi_004
    query: "tampilkan SD di sukabumi dan bandingkan dengan cianjur"
    expected:
      module: multi_intent
      sub_intents: [list, comparison]
      entities:
        jenjang: [SD]
        wilayah: ["sukabumi", "cianjur"]
    must_not:
      module: out_of_context
    tags: [multi_intent, list_plus_comparison]
    notes: "List + comparison implicit."

  - id: multi_005
    query: "cari SMK akreditasi A di bekasi, ada berapa dan tampilkan daftarnya"
    expected:
      module: multi_intent
      sub_intents: [aggregation, list]
      entities:
        jenjang: [SMK]
        akreditasi: A
        kabupaten: "bekasi"
    must_not:
      module: out_of_context
    tags: [multi_intent, aggregation_plus_list]
    notes: "Explicit aggregation + list dalam satu kalimat."

  # ---------------------------------------------------------------------------
  # AMBIGUITY & EDGE CASES (8 cases)
  # ---------------------------------------------------------------------------

  - id: edge_001
    query: "sekolah di cibunar"
    expected:
      module: list
      scope: desa
      status: ambiguous
      entities:
        desa: "cibunar"
    must_not:
      module: out_of_context
    tags: [edge, ambiguous_location, desa_duplikat]
    notes: "Nama desa yang ada di banyak kecamatan — harus return AMBIGUOUS bukan error."

  - id: edge_002
    query: "smp di bandung"
    expected:
      module: aggregation
      entities:
        jenjang: [SMP]
        kabupaten: "bandung"
    must_not:
      module: out_of_context
    tags: [edge, ambiguous_intent, bisa_list_atau_agg]
    notes: "Bisa list atau aggregation — harus pilih yang paling useful (aggregation count)."

  - id: edge_003
    query: "brp sklh di bdg akrd A"
    expected:
      module: aggregation
      entities:
        akreditasi: A
        kabupaten: "bandung"
    must_not:
      module: out_of_context
    tags: [edge, heavy_typo]
    notes: "Heavy typo dan abbreviation. Stress test untuk normalizer."

  - id: edge_004
    query: "sekolah jakarta"
    expected:
      module: list
      entities:
        provinsi: "dki jakarta"
    must_not:
      module: out_of_context
    tags: [edge, minimal_query, dua_kata]
    notes: "Query minimal 2 kata. Harus resolve dan return hasil, bukan error."

  - id: edge_005
    query: "berapa sekolah di cibunar parungpanjang bogor"
    expected:
      module: aggregation
      scope: desa
      entities:
        desa: "cibunar"
        kecamatan: "parungpanjang"
        kabupaten: "bogor"
    must_not:
      module: out_of_context
      status: ambiguous
    tags: [edge, hierarki_lengkap, disambiguasi_sukses]
    notes: "Hierarki lengkap diberikan — harus auto-resolve tanpa ambiguous."

  - id: edge_006
    query: "berapa SD di kab. tangerang vs kota tangerang"
    expected:
      module: comparison
      entities:
        jenjang: [SD]
        wilayah: ["tangerang", "kota tangerang"]
    must_not:
      module: out_of_context
    tags: [edge, kab_vs_kota, nama_mirip]
    notes: "Kab. Tangerang vs Kota Tangerang — harus dibedakan."

  - id: edge_007
    query: "ranking SMK terbanyak per provinsi"
    expected:
      module: aggregation
      entities:
        jenjang: [SMK]
        scope: nasional
        breakdown: provinsi
    must_not:
      module: out_of_context
    tags: [edge, ranking, breakdown]
    notes: "Ranking/breakdown nasional per provinsi."

  - id: edge_008
    query: "sekolah dengan data tidak lengkap di jawa barat"
    expected:
      module: aggregation
      entities:
        qc_filter: true
        provinsi: "jawa barat"
    must_not:
      module: out_of_context
    tags: [edge, qc_query]
    notes: "Query QC — harus detect intent data quality."

