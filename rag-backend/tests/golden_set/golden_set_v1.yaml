# =============================================================================
# GOLDEN SET — Intent Classification & Entity Extraction
# =============================================================================
# Versi: 1.0 (Mei 2026)
# Tujuan: Test ground-truth untuk semua perubahan classifier/parser/narrator.
#
# Cara pakai:
#   pytest tests/golden_set/test_intent_classification.py -v
#
# Format setiap case:
#   id: unik, prefix = kategori
#   query: pertanyaan mentah dari user (variasi realistis)
#   expected.module: intent utama yang harus dideteksi
#   expected.scope: level wilayah (nasional/provinsi/kabupaten/kecamatan/desa)
#   expected.entities: entitas yang harus terekstrak
#   must_not: kondisi yang TIDAK boleh ada di output
#   tags: label untuk filter dan reporting
#   notes: konteks untuk reviewer
# =============================================================================

cases:

  # ---------------------------------------------------------------------------
  # AGGREGATION — Single Intent, Lokasi Jelas (10 cases)
  # ---------------------------------------------------------------------------

  - id: agg_001
    query: "berapa SD di jawa barat"
    expected:
      module: aggregation
      scope: provinsi
      entities:
        jenjang: [SD]
        provinsi: "jawa barat"
    must_not:
      module: out_of_context
    tags: [aggregation, simple, provinsi, sd]
    notes: "Query paling basic. Harus resolve provinsi dengan benar."

  - id: agg_002
    query: "jumlah SMP negeri di bandung"
    expected:
      module: aggregation
      scope: kabupaten
      entities:
        jenjang: [SMP]
        status: NEGERI
        kabupaten: "bandung"
    must_not:
      module: out_of_context
    tags: [aggregation, simple, kabupaten, status_filter]
    notes: "Harus detect status NEGERI dan lokasi kabupaten bandung (bukan kota bandung)."

  - id: agg_003
    query: "brapa smk di tangsel"
    expected:
      module: aggregation
      scope: kabupaten
      entities:
        jenjang: [SMK]
        kabupaten: "tangerang selatan"
    must_not:
      module: out_of_context
    tags: [aggregation, typo, alias, kabupaten]
    notes: "Typo 'brapa' + alias 'tangsel' harus dinormalisasi."

  - id: agg_004
    query: "total sekolah akreditasi A di surabaya"
    expected:
      module: aggregation
      scope: kabupaten
      entities:
        akreditasi: A
        kabupaten: "surabaya"
    must_not:
      module: out_of_context
    tags: [aggregation, akreditasi, kabupaten]
    notes: "Filter akreditasi A."

  - id: agg_005
    query: "berapa sekolah di indonesia"
    expected:
      module: aggregation
      scope: nasional
      entities: {}
    must_not:
      module: out_of_context
    tags: [aggregation, nasional, no_filter]
    notes: "Scope nasional, tanpa filter jenjang."

  - id: agg_006
    query: "SD swasta di kecamatan cibinong berapa"
    expected:
      module: aggregation
      scope: kecamatan
      entities:
        jenjang: [SD]
        status: SWASTA
        kecamatan: "cibinong"
    must_not:
      module: out_of_context
    tags: [aggregation, kecamatan, status_filter]
    notes: "Scope kecamatan. Urutan kata tidak kanonik."

  - id: agg_007
    query: "berapa SMA dan SMK di jawa tengah"
    expected:
      module: aggregation
      scope: provinsi
      entities:
        jenjang: [SMA, SMK]
        provinsi: "jawa tengah"
    must_not:
      module: out_of_context
    tags: [aggregation, multi_jenjang, provinsi]
    notes: "Multi-jenjang dalam satu query."

  - id: agg_008
    query: "jumlah madrasah ibtidaiyah di NTT"
    expected:
      module: aggregation
      scope: provinsi
      entities:
        jenjang: [MI]
        provinsi: "nusa tenggara timur"
    must_not:
      module: out_of_context
    tags: [aggregation, madrasah, alias_provinsi]
    notes: "Alias 'NTT' dan nama panjang jenjang MI."

  - id: agg_009
    query: "sekolah negeri akreditasi B di kab bogor ada berapa"
    expected:
      module: aggregation
      scope: kabupaten
      entities:
        status: NEGERI
        akreditasi: B
        kabupaten: "bogor"
    must_not:
      module: out_of_context
    tags: [aggregation, multi_filter, kabupaten]
    notes: "Multi-filter: status + akreditasi + lokasi."

  - id: agg_010
    query: "ada berapa TK di DKI"
    expected:
      module: aggregation
      scope: provinsi
      entities:
        jenjang: [TK]
        provinsi: "dki jakarta"
    must_not:
      module: out_of_context
    tags: [aggregation, alias_dki, tk]
    notes: "Alias 'DKI' untuk Jakarta."

  # ---------------------------------------------------------------------------
  # LIST — Daftar Sekolah (8 cases)
  # ---------------------------------------------------------------------------

  - id: list_001
    query: "daftar SMA negeri di jakarta selatan"
    expected:
      module: list
      scope: kabupaten
      entities:
        jenjang: [SMA]
        status: NEGERI
        kabupaten: "jakarta selatan"
    must_not:
      module: out_of_context
    tags: [list, simple, status_filter]
    notes: "Query list paling umum."

  - id: list_002
    query: "tampilkan sekolah akreditasi A di kota bandung"
    expected:
      module: list
      scope: kabupaten
      entities:
        akreditasi: A
        kabupaten: "bandung"
    must_not:
      module: out_of_context
    tags: [list, akreditasi]
    notes: "Trigger kata 'tampilkan'."

  - id: list_003
    query: "sekolah di desa neglasari tangerang"
    expected:
      module: list
      scope: desa
      entities:
        desa: "neglasari"
        kabupaten: "tangerang"
    must_not:
      module: out_of_context
    tags: [list, desa, disambiguasi]
    notes: "Scope desa — potensi ambiguitas nama desa."

  - id: list_004
    query: "cari SMK swasta di bekasi yang akreditasi A"
    expected:
      module: list
      scope: kabupaten
      entities:
        jenjang: [SMK]
        status: SWASTA
        akreditasi: A
        kabupaten: "bekasi"
    must_not:
      module: out_of_context
    tags: [list, multi_filter]
    notes: "Multi-filter: jenjang + status + akreditasi."

  - id: list_005
    query: "sekolah luar biasa di sulawesi selatan"
    expected:
      module: list
      scope: provinsi
      entities:
        jenjang: [SLB]
        provinsi: "sulawesi selatan"
    must_not:
      module: out_of_context
    tags: [list, slb, nama_panjang]
    notes: "'sekolah luar biasa' harus map ke jenjang SLB."

  - id: list_006
    query: "PKBM di kecamatan parungpanjang"
    expected:
      module: list
      scope: kecamatan
      entities:
        jenjang: [PKBM]
        kecamatan: "parungpanjang"
    must_not:
      module: out_of_context
    tags: [list, pkbm, kecamatan]
    notes: "Jenjang non-formal PKBM."

  - id: list_007
    query: "sekolah negeri di jakpus"
    expected:
      module: list
      scope: kabupaten
      entities:
        status: NEGERI
        kabupaten: "jakarta pusat"
    must_not:
      module: out_of_context
    tags: [list, alias_jakpus]
    notes: "Alias 'jakpus' → jakarta pusat."

  - id: list_008
    query: "ada sekolah apa saja di desa cibunar parungpanjang"
    expected:
      module: list
      scope: desa
      entities:
        desa: "cibunar"
        kecamatan: "parungpanjang"
    must_not:
      module: out_of_context
    tags: [list, desa, disambiguasi, hierarki]
    notes: "Nama desa ambigus + kecamatan sebagai konteks → harus auto-resolve."

  # ---------------------------------------------------------------------------
  # PROFILE — Detail Sekolah (6 cases)
  # ---------------------------------------------------------------------------

  - id: profile_001
    query: "profil SMAN 1 Bandung"
    expected:
      module: profile
      entities:
        nama_sekolah: "SMAN 1 Bandung"
    must_not:
      module: out_of_context
