    notes: "Profile query paling dasar."

  - id: profile_002
    query: "info sekolah dengan NPSN 20217725"
    expected:
      module: profile
      entities:
        npsn: "20217725"
    must_not:
      module: out_of_context
    tags: [profile, npsn]
    notes: "Lookup by NPSN — harus ekstrak 8 digit angka."

  - id: profile_003
    query: "alamat SDN Merdeka 1 di cimahi"
    expected:
      module: profile
      entities:
        nama_sekolah: "SDN Merdeka 1"
        kabupaten: "cimahi"
    must_not:
      module: out_of_context
    tags: [profile, alamat, filter_lokasi]
    notes: "User minta spesifik alamat + filter lokasi untuk disambiguasi."

  - id: profile_004
    query: "akreditasi SMK Negeri 2 Surabaya berapa"
    expected:
