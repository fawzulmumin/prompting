    notes: "User minta field spesifik (akreditasi) dari profile."

  - id: profile_005
    query: "jumlah siswa di SMP Islam Al-Azhar 1 Jakarta"
    expected:
      module: profile
      entities:
        nama_sekolah: "SMP Islam Al-Azhar 1"
        kabupaten: "jakarta"
    must_not:
      module: out_of_context
    tags: [profile, siswa, swasta]
    notes: "Sekolah swasta dengan nama panjang."

  - id: profile_006
    query: "kontak madrasah aliyah negeri 1 yogyakarta"
    expected:
      module: profile
      entities:
        nama_sekolah: "MAN 1 Yogyakarta"
    must_not:
      module: out_of_context
    tags: [profile, madrasah, kontak]
    notes: "Nama panjang madrasah aliyah negeri → MAN."

  # ---------------------------------------------------------------------------
  # COMPARISON — Perbandingan (6 cases)
  # ---------------------------------------------------------------------------

  - id: comp_001
    query: "bandingkan jumlah SMA di Jawa Barat dan Jawa Timur"
    expected:
      module: comparison
      entities:
        jenjang: [SMA]
        wilayah: ["jawa barat", "jawa timur"]
    must_not:
      module: out_of_context
    tags: [comparison, provinsi, multi_wilayah]
    notes: "Perbandingan dua provinsi."

  - id: comp_002
    query: "mana yang lebih banyak SMK, jakarta atau surabaya"
    expected:
      module: comparison
      entities:
        jenjang: [SMK]
        wilayah: ["jakarta", "surabaya"]
    must_not:
      module: out_of_context
    tags: [comparison, informal, multi_wilayah]
    notes: "Bahasa informal 'mana yang lebih banyak'."

  - id: comp_003
    query: "perbandingan sekolah negeri vs swasta di DIY"
    expected:
      module: comparison
      entities:
        status: [NEGERI, SWASTA]
        provinsi: "diy"
    must_not:
      module: out_of_context
    tags: [comparison, status, provinsi]
    notes: "Perbandingan status bukan wilayah."

  - id: comp_004
    query: "bandingkan akreditasi SMP di kab bogor dan kab depok"
    expected:
      module: comparison
      entities:
        jenjang: [SMP]
        wilayah: ["bogor", "depok"]
    must_not:
      module: out_of_context
    tags: [comparison, akreditasi, kabupaten]
    notes: "Perbandingan dua kabupaten."

  - id: comp_005
    query: "SMK negeri di tangerang vs tangerang selatan berapa"
    expected:
      module: comparison
      entities:
        jenjang: [SMK]
        status: NEGERI
        wilayah: ["tangerang", "tangerang selatan"]
    must_not:
      module: out_of_context
    tags: [comparison, wilayah_mirip, disambiguasi]
    notes: "Dua wilayah nama mirip — harus dibedakan dengan benar."

  - id: comp_006
    query: "jumlah SD di kecamatan bogor utara vs bogor selatan"
    expected:
      module: comparison
      entities:
        jenjang: [SD]
        wilayah: ["bogor utara", "bogor selatan"]
        scope: kecamatan
    must_not:
      module: out_of_context
    tags: [comparison, kecamatan, multi_wilayah]
    notes: "Perbandingan antar kecamatan dalam kota yang sama."

  # ---------------------------------------------------------------------------
  # GEO / NEARBY — Sekolah Terdekat (4 cases)
