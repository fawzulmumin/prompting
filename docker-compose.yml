version: '3.8'

services:
  rag-app:
    build: .
    container_name: rag-service
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G  # Sesuai untuk 1 juta+ dokumen dengan embedding
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/app/.cache
      - PYTHON_ENV=production
    volumes:
      - ./logs:/app/logs
      - ./model_cache:/app/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

